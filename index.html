<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eid Mubarak - Ramzan 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --eid-gold: #D4AF37;
            --eid-gold-light: #F9E29B;
            --eid-blue-dark: #0A192F;
            --eid-blue-accent: #172A45;
            --text-light: #E6F1FF;
            --text-gold: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--eid-blue-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            text-align: center;
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, var(--eid-blue-accent) 0%, var(--eid-blue-dark) 100%);
            z-index: -1;
        }

        .content-wrapper {
            max-width: 600px;
            width: 90%;
            padding: 30px;
            z-index: 1;
            animation: fadeIn 2s ease-out;
            background: rgba(10, 25, 47, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin: 20px auto;
        }

        .wisher-name {
            display: block;
            font-size: 1.2rem;
            color: var(--eid-gold-light);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: min(3.5rem, 12vw);
            color: var(--eid-gold);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--eid-gold) 0%, #B8860B 100%);
            color: var(--eid-blue-dark);
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            border: none;
            cursor: pointer;
            width: auto;
            min-width: 220px;
        }

        .primary-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .secondary-link {
            color: var(--eid-gold-light);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            border-bottom: 1px solid transparent;
            margin-top: 10px;
            display: inline-block;
        }

        .secondary-link:hover {
            opacity: 1;
            border-bottom: 1px solid var(--eid-gold-light);
        }

        /* Modal Styles */
        #nameModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.98);
            display: none; /* Changed from visibility/opacity */
            justify-content: center;
            align-items: center;
            z-index: 99999;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        #nameModal.active {
            display: flex;
        }

        .modal-content {
            background: var(--eid-blue-accent);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid var(--eid-gold);
            max-width: 90%;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--eid-gold);
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
        }

        #nameInput {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: 2px solid var(--eid-gold);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.2rem;
            margin-bottom: 25px;
            outline: none;
            text-align: center;
        }

        #nameInput::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Lantern Animation */
        .lantern {
            position: absolute;
            width: 50px;
            height: 70px;
            background: var(--eid-gold);
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L9 5H15L12 2ZM7 6V18H17V6H7ZM12 22L15 19H9L12 22Z"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L9 5H15L12 2ZM7 6V18H17V6H7ZM12 22L15 19H9L12 22Z"/></svg>');
            animation: swing 3s infinite ease-in-out;
            transform-origin: top center;
            opacity: 0.4;
            pointer-events: none;
        }

        .lantern.left { top: 10px; left: 5%; animation-delay: 0s; }
        .lantern.right { top: 10px; right: 5%; animation-delay: 0.5s; }

        @keyframes swing {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .instagram-footer {
            margin-top: 25px;
        }

        .visitor-counter {
            margin-top: 15px;
            opacity: 0.7;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .content-wrapper { padding: 25px 15px; width: 92%; }
            h1 { font-size: 2.6rem; }
            .primary-btn { width: 100%; min-width: unset; }
            .modal-content { padding: 25px 20px; }
        }
    </style>
</head>
<body id="body">
    <canvas id="fireworks-canvas"></canvas>
    <div class="background-overlay"></div>
    
    <div class="lantern left"></div>
    <div class="lantern right"></div>

    <div class="content-wrapper">
        <span id="wisher-name" class="wisher-name"></span>
        <h1 id="greeting">Eid Mubarak!</h1>
        <p id="sub-greeting">May this special day bring peace, happiness, and prosperity to you and your family. Wishing you a joyous celebration filled with love and blessings.</p>
        
        <div class="btn-container">
            <button id="share-btn" class="primary-btn">Share the Joy</button>
            <button id="create-own-btn" class="secondary-link" style="background:none; border:none; cursor:pointer;">Create Your Own Greeting</button>
            <a href="index1.html" class="secondary-link">View Ramadan 2026 Calendar</a>
        </div>

        <div class="instagram-footer">
            <a href="https://www.instagram.com/kaimu_zx78/" target="_blank" class="secondary-link" style="opacity: 0.8; font-weight: 700;">
                <i class="fab fa-instagram"></i> @kaimu_zx78
            </a>
            <div class="visitor-counter">
                <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fkaimuzx78.github.io%2Framzan2026&count_bg=%23D4AF37&title_bg=%23172A45&icon=&icon_color=%23E7E7E7&title=Visitors&edge_flat=false" alt="Visitor Counter"/>
            </div>
        </div>
    </div>

    <!-- Modal for Name Input -->
    <div id="nameModal">
        <div class="modal-content">
            <h2>Enter Your Name</h2>
            <p style="margin-bottom: 20px; font-size: 0.9rem; color: #aaa;">To create your personalized Eid greeting for friends and family!</p>
            <input type="text" id="nameInput" placeholder="Your Name" maxlength="20">
            <button id="saveNameBtn" class="primary-btn" style="width: 100%; min-width: 100%;">Create My Greeting</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.friction = 0.95;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02;
            }
        }

        function createFirework(x, y) {
            const particleCount = 20;
            const colors = ['#D4AF37', '#F9E29B', '#FFFFFF', '#B8860B'];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, i) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(i, 1);
                }
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'INPUT') {
                createFirework(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'INPUT') {
                const touch = e.touches[0];
                createFirework(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();

        // Personalized Logic
        function initGreeting() {
            const urlParams = new URLSearchParams(window.location.search);
            const wisherName = urlParams.get('name');
            const wisherDisplay = document.getElementById('wisher-name');
            const nameModal = document.getElementById('nameModal');
            const nameInput = document.getElementById('nameInput');
            const saveNameBtn = document.getElementById('saveNameBtn');
            const shareBtn = document.getElementById('share-btn');
            const createOwnBtn = document.getElementById('create-own-btn');

            if (wisherName && wisherName.trim() !== "") {
                wisherDisplay.innerText = decodeURIComponent(wisherName);
                document.getElementById('greeting').innerText = "Wishing You Eid Mubarak!";
                nameModal.classList.remove('active');
            } else {
                console.log("No name found, showing modal");
                nameModal.style.display = 'flex';
                nameModal.classList.add('active');
            }

            saveNameBtn.addEventListener('click', (e) => {
                const name = nameInput.value.trim();
                if (name) {
                    const newUrl = window.location.origin + window.location.pathname + '?name=' + encodeURIComponent(name);
                    window.location.href = newUrl;
                }
            });

            createOwnBtn.addEventListener('click', () => {
                nameModal.style.display = 'flex';
                nameModal.classList.add('active');
            });

            shareBtn.addEventListener('click', () => {
                const currentName = wisherName || "A Friend";
                const shareUrl = window.location.origin + window.location.pathname + '?name=' + encodeURIComponent(currentName);
                const text = encodeURIComponent(`*${currentName}* has sent you a special Eid greeting! 🌙✨\n\nOpen it here and see the magic: ${shareUrl}`);
                window.open(`https://wa.me/?text=${text}`, '_blank');
            });

            // Handle Enter key
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') saveNameBtn.click();
            });
        }

        document.addEventListener('DOMContentLoaded', initGreeting);
        // Fallback for some browsers
        window.onload = () => {
            if (!document.getElementById('nameModal').classList.contains('active') && !window.location.search.includes('name=')) {
                initGreeting();
            }
        };
    </script>
</body>
</html>
