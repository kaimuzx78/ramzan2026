<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eid Mubarak - Ramzan 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --eid-gold: #D4AF37;
            --eid-gold-light: #F9E29B;
            --eid-blue-dark: #0A192F;
            --eid-blue-accent: #172A45;
            --text-light: #E6F1FF;
            --text-gold: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--eid-blue-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            text-align: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(23, 42, 69, 0.4) 0%, var(--eid-blue-dark) 100%);
            z-index: -1;
        }

        .content-wrapper {
            max-width: 600px;
            width: 90%;
            padding: 40px 30px;
            z-index: 10;
            background: rgba(10, 25, 47, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            margin: 20px auto;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease-out;
        }

        .wisher-name {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--eid-gold), var(--eid-gold-light), #FFF, var(--eid-gold-light), var(--eid-gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 15px 30px rgba(212, 175, 55, 0.3);
            animation: shine 3s linear infinite, float 4s infinite ease-in-out;
            transform: translateZ(50px);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes float {
            0%, 100% { transform: translateZ(50px) translateY(0); }
            50% { transform: translateZ(50px) translateY(-8px); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: min(4rem, 14vw);
            color: var(--eid-gold);
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            transform: translateZ(30px);
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            opacity: 0.95;
            transform: translateZ(10px);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            transform: translateZ(20px);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--eid-gold) 0%, #B8860B 100%);
            color: var(--eid-blue-dark);
            padding: 15px 45px;
            border-radius: 60px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            border: none;
            cursor: pointer;
            width: auto;
            min-width: 250px;
        }

        .primary-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.6);
        }

        .secondary-link {
            color: var(--eid-gold-light);
            text-decoration: none;
            font-size: 0.95rem;
            opacity: 0.8;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
            margin-top: 10px;
            display: inline-block;
            font-weight: 600;
        }

        .secondary-link:hover {
            opacity: 1;
            color: white;
            border-bottom: 1px solid var(--eid-gold-light);
        }

        /* Modal Styles */
        #nameModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        #nameModal.active {
            display: flex;
        }

        .modal-content {
            background: var(--eid-blue-accent);
            padding: 40px;
            border-radius: 35px;
            border: 2px solid var(--eid-gold);
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,1);
            animation: modalPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.6) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--eid-gold);
            margin-bottom: 15px;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
        }

        #nameInput {
            width: 100%;
            padding: 20px;
            border-radius: 35px;
            border: 2px solid var(--eid-gold);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.4rem;
            margin-bottom: 30px;
            outline: none;
            text-align: center;
        }

        /* Lantern Animation */
        .lantern {
            position: absolute;
            width: 60px;
            height: 80px;
            background: var(--eid-gold);
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L9 5H15L12 2ZM7 6V18H17V6H7ZM12 22L15 19H9L12 22Z"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2L9 5H15L12 2ZM7 6V18H17V6H7ZM12 22L15 19H9L12 22Z"/></svg>');
            animation: swing 4s infinite ease-in-out;
            transform-origin: top center;
            opacity: 0.6;
            pointer-events: none;
            z-index: 5;
        }

        .lantern.left { top: 20px; left: 10%; animation-delay: 0s; }
        .lantern.right { top: 20px; right: 10%; animation-delay: 0.5s; }

        @keyframes swing {
            0% { transform: rotate(-12deg); }
            50% { transform: rotate(12deg); }
            100% { transform: rotate(-12deg); }
        }

        .instagram-footer {
            margin-top: 40px;
            transform: translateZ(10px);
        }

        .highlight-link {
            background: rgba(212, 175, 55, 0.15);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s ease;
        }

        .highlight-link:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: var(--eid-gold);
            transform: scale(1.08) translateY(-2px);
        }

        .visitor-counter {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 25px;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 480px) {
            .content-wrapper { padding: 35px 20px; width: 94%; }
            h1 { font-size: 3rem; }
            .primary-btn { width: 100%; min-width: unset; }
            .modal-content { padding: 35px 25px; }
            .lantern { width: 45px; height: 60px; }
        }
    </style>
</head>
<body id="body">
    <canvas id="bg-canvas"></canvas>
    <canvas id="fireworks-canvas"></canvas>
    <div class="background-overlay"></div>
    
    <div class="lantern left"></div>
    <div class="lantern right"></div>

    <div id="card" class="content-wrapper">
        <span id="wisher-name" class="wisher-name"></span>
        <h1 id="greeting">Eid Mubarak!</h1>
        <p>Wishing you a joyous celebration filled with love and blessings. May this special day bring peace and prosperity to you and your family.</p>
        
        <div class="btn-container">
            <button id="share-btn" class="primary-btn">Share the Joy</button>
            <button id="create-own-btn" class="secondary-link" style="background:none; border:none; cursor:pointer;">Create Your Own Greeting</button>
            <a href="index1.html" class="secondary-link">View Ramadan 2026 Calendar</a>
        </div>

        <div class="instagram-footer">
            <a href="https://www.instagram.com/kaimu_zx78/" target="_blank" class="highlight-link">
                <i class="fab fa-instagram" style="color: var(--eid-gold); font-size: 1.2rem;"></i> 
                <span style="color: var(--eid-gold-light); font-weight: 800; font-size: 1rem;">@kaimu_zx78</span>
            </a>
            <br>
            <div class="visitor-counter">
                <img src="https://api.visitorbadge.io/api/combined?path=kaimuzx78-ramzan2026&label=VISITORS&labelColor=%23172a45&countColor=%23d4af37&style=flat&text=" alt="Visitor Counter"/>
            </div>
        </div>
    </div>

    <!-- Modal for Name Input -->
    <div id="nameModal">
        <div class="modal-content">
            <h2>Enter Your Name</h2>
            <p style="margin-bottom: 30px; font-size: 1rem; color: #bbb;">Create your extraordinary 3D Eid greeting for friends and family!</p>
            <input type="text" id="nameInput" placeholder="Enter Your Name" maxlength="20">
            <button id="saveNameBtn" class="primary-btn" style="width: 100%; min-width: 100%;">Create My Greeting</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js Optimized Starfield Background
        const bgCanvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, alpha: true, antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1); // Performance optimization
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;

        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const particleCount = 2000;

        for (let i = 0; i < particleCount; i++) {
            vertices.push(
                THREE.MathUtils.randFloatSpread(1000),
                THREE.MathUtils.randFloatSpread(1000),
                THREE.MathUtils.randFloatSpread(1000)
            );
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0xD4AF37, size: 2, sizeAttenuation: true, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(geometry, material);
        scene.add(stars);

        function animateBg() {
            requestAnimationFrame(animateBg);
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animateBg();

        // Fireworks Canvas Logic
        const fwCanvas = document.getElementById('fireworks-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        let particles = [];

        function resizeFwCanvas() {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 12, y: (Math.random() - 0.5) * 12 };
                this.alpha = 1; this.friction = 0.96;
            }
            draw() {
                fwCtx.save(); fwCtx.globalAlpha = this.alpha; fwCtx.beginPath();
                fwCtx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                fwCtx.fillStyle = this.color; fwCtx.fill(); fwCtx.restore();
            }
            update() {
                this.velocity.x *= this.friction; this.velocity.y *= this.friction;
                this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
        }

        function createFirework(x, y) {
            const colors = ['#D4AF37', '#F9E29B', '#FFFFFF', '#B8860B'];
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function animateFw() {
            requestAnimationFrame(animateFw);
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            particles.forEach((p, i) => {
                if (p.alpha > 0) { p.update(); p.draw(); }
                else { particles.splice(i, 1); }
            });
        }
        resizeFwCanvas();
        animateFw();

        // 3D Tilt Effect Logic (Lag-Free)
        const card = document.getElementById('card');
        const handleTilt = (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotX = (y - centerY) / 20;
            const rotY = (centerX - x) / 20;
            card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        };
        const resetTilt = () => { card.style.transform = `rotateX(0deg) rotateY(0deg)`; };

        if (!/Android|iPhone/i.test(navigator.userAgent)) {
            card.addEventListener('mousemove', handleTilt);
            card.addEventListener('mouseleave', resetTilt);
        } else {
            // Mobile Device Orientation Fallback (Subtle)
            window.addEventListener('deviceorientation', (e) => {
                const rotX = e.beta / 10;
                const rotY = e.gamma / 10;
                card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'INPUT') {
                createFirework(e.clientX, e.clientY);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'INPUT') {
                const touch = e.touches[0];
                createFirework(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Personalized Logic
        function initGreeting() {
            const urlParams = new URLSearchParams(window.location.search);
            const wisherNameRaw = urlParams.get('name');
            const wisherName = wisherNameRaw ? decodeURIComponent(wisherNameRaw).trim() : null;
            
            const wisherDisplay = document.getElementById('wisher-name');
            const nameModal = document.getElementById('nameModal');
            const nameInput = document.getElementById('nameInput');
            const saveNameBtn = document.getElementById('saveNameBtn');
            const shareBtn = document.getElementById('share-btn');
            const createOwnBtn = document.getElementById('create-own-btn');

            if (wisherName && wisherName !== "") {
                wisherDisplay.innerText = wisherName;
                document.getElementById('greeting').innerText = "Wishing You Eid Mubarak!";
                nameModal.classList.remove('active');
            } else {
                nameModal.style.display = 'flex';
                nameModal.classList.add('active');
            }

            saveNameBtn.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (name) {
                    const newUrl = window.location.origin + window.location.pathname + '?name=' + encodeURIComponent(name);
                    window.location.href = newUrl;
                }
            });

            createOwnBtn.addEventListener('click', () => {
                nameModal.style.display = 'flex';
                nameModal.classList.add('active');
                nameInput.focus();
            });

            shareBtn.addEventListener('click', () => {
                if (!wisherName || wisherName === "") {
                    nameModal.style.display = 'flex';
                    nameModal.classList.add('active');
                    nameInput.focus();
                } else {
                    const text = encodeURIComponent(`*${wisherName}* has sent you an extraordinary 3D Eid greeting! 🎆✨\n\nSee the magic here: ${window.location.href}`);
                    window.open(`https://wa.me/?text=${text}`, '_blank');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', initGreeting);
    </script>
</body>
</html>
